# Vigia de cambios en el HTML de jkanime y animeflv (D1+E4).
#
# Descarga paginas testigo y verifica que los marcadores que usa el script
# sigan existiendo. Si alguno falta, el job falla y avisa ANTES de que los
# usuarios lo sufran. No toca la red fuera de este workflow (schedule/manual).
name: Snapshot fuentes

on:
  schedule:
    # Lunes 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar paginas testigo
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
          mkdir -p /tmp/snap
          HDRS=(-A "$UA"
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
            -H "Accept-Language: es-ES,es;q=0.9,en;q=0.8"
            -H "Referer: https://jkanime.net/"
            --compressed)
          code_busq=$(curl -s -o /tmp/snap/busqueda.html -w "%{http_code}" \
            --max-time 25 --retry 2 "${HDRS[@]}" \
            "https://jkanime.net/buscar/pokemon/")
          code_det=$(curl -s -c /tmp/snap/cookies.txt -o /tmp/snap/detalle.html -w "%{http_code}" \
            --max-time 25 --retry 2 "${HDRS[@]}" \
            "https://jkanime.net/pokemon/")
          echo "HTTP busqueda=$code_busq detalle=$code_det"
          # 403 = el WAF bloquea la IP del runner (el sitio sigue vivo para
          # usuarios reales): no es fallo de marcadores, se delega a QA manual.
          if [ "$code_busq" = "403" ] || [ "$code_det" = "403" ]; then
            echo "::warning::jkanime bloquea la IP del runner (HTTP 403). Verificacion manual requerida en terminal real."
            echo "BLOQUEADO=1" >> "$GITHUB_ENV"
          elif [ "$code_busq" != "200" ] || [ "$code_det" != "200" ]; then
            echo "::error::Descarga fallo (HTTP $code_busq/$code_det). Sitio posiblemente caido."
            exit 1
          else
            TOKEN=$(grep -oP 'meta name="csrf-token" content="\K[^"]+' /tmp/snap/detalle.html | head -n1)
            API=$(grep -oP "url:\s*'\Khttps://jkanime\.net/ajax/episodes/\d+/?" /tmp/snap/detalle.html | head -n1)
            echo "TOKEN_LEN=${#TOKEN}" >> "$GITHUB_ENV"
            if [ -n "$TOKEN" ] && [ -n "$API" ]; then
              curl -s --max-time 25 --retry 2 -X POST "$API" -b /tmp/snap/cookies.txt \
                -H "X-Requested-With: XMLHttpRequest" \
                -H "X-CSRF-TOKEN: $TOKEN" \
                --data-urlencode "_token=$TOKEN" \
                -o /tmp/snap/episodios.json
            fi
          fi
          # ---- animeflv ----
          AF="https://vww.animeflv.one"
          code_af_b=$(curl -s -o /tmp/snap/af_busq.html -w "%{http_code}" \
            --max-time 25 --retry 2 "${HDRS[@]}" \
            "$AF/animes?buscar=naruto&pag=1")
          code_af_d=$(curl -s -c /tmp/snap/af_cookies.txt -o /tmp/snap/af_det.html -w "%{http_code}" \
            --max-time 25 --retry 2 "${HDRS[@]}" \
            "$AF/anime/naruto")
          echo "HTTP af_busqueda=$code_af_b af_detalle=$code_af_d"
          if [ "$code_af_b" = "403" ] || [ "$code_af_d" = "403" ]; then
            echo "::warning::animeflv bloquea la IP del runner (HTTP 403). Verificacion manual requerida."
            echo "AF_BLOQUEADO=1" >> "$GITHUB_ENV"
          elif [ "$code_af_b" != "200" ] || [ "$code_af_d" != "200" ]; then
            echo "::error::Descarga animeflv fallo (HTTP $code_af_b/$code_af_d)."
            exit 1
          else
            code_af_c=$(curl -s -c /tmp/snap/af_cookies.txt -o /tmp/snap/af_cap.html -w "%{http_code}" \
              --max-time 25 --retry 2 "${HDRS[@]}" \
              "$AF/ver/naruto-1")
            echo "HTTP af_capitulo=$code_af_c"
            [ "$code_af_c" = "403" ] && echo "AF_BLOQUEADO=1" >> "$GITHUB_ENV"
            [ "$code_af_c" != "200" ] && [ "$code_af_c" != "403" ] && { echo "::error::Descarga capitulo AF fallo (HTTP $code_af_c)."; exit 1; }
          fi

      - name: Verificar marcadores
        if: env.BLOQUEADO != '1'
        run: |
          fallo=0
          check() {
            if ! grep -qaP "$2" "$1"; then
              echo "::error::Marcador perdido: $3 (archivo $1)"
              fallo=1
            else
              echo "OK: $3"
            fi
          }
          check /tmp/snap/busqueda.html '<h5><a\s+href=' "busqueda <h5><a>"
          check /tmp/snap/detalle.html 'meta name="csrf-token"' "detalle csrf-token"
          check /tmp/snap/detalle.html 'ajax/episodes/[0-9]+' "detalle ajax/episodes"
          check /tmp/snap/detalle.html '<span>Tipo:</span>' "detalle Tipo:"
          check /tmp/snap/detalle.html '/idioma/' "detalle /idioma/"
          if [ -f /tmp/snap/episodios.json ]; then
            check /tmp/snap/episodios.json '"total":' "ajax total"
          else
            echo "::error::Marcador perdido: ajax episodios.json (POST fallo)"
            fallo=1
          fi
          exit $fallo

      - name: Verificar marcadores animeflv
        if: env.AF_BLOQUEADO != '1'
        run: |
          fallo=0
          check() {
            if ! grep -qaP "$2" "$1"; then
              echo "::error::Marcador AF perdido: $3 (archivo $1)"
              fallo=1
            else
              echo "OK AF: $3"
            fi
          }
          check /tmp/snap/af_busq.html '<h3 class="h"><a href="\./anime/' "busqueda anime/<slug>"
          check /tmp/snap/af_det.html 'data-ep="[0-9]+' "detalle data-ep"
          check /tmp/snap/af_det.html 'var eps\s*=' "detalle var eps"
          if [ -f /tmp/snap/af_cap.html ]; then
            check /tmp/snap/af_cap.html 'data-encrypt' "capitulo data-encrypt"
          fi
          exit $fallo
